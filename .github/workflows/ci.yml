name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build --build-system native
      - name: Test
        run: swift test --build-system native --parallel
      - name: CLI smoke tests
        run: Scripts/test-cli.sh
      - name: Build release app bundle
        run: Scripts/build-app.sh
      - name: Verify bundle
        run: codesign --verify --deep --strict dist/MacTape.app
